name: APK debug

# Tag v* (ex. v0.2.0) : construit l'APK et publie une Release GitHub avec l'APK en pièce jointe.
# Manuel (onglet Actions) : construit l'APK et le dépose en artefact, sans Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: "4.7.2"

jobs:
  apk:
    name: Construire l'APK debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : versionCode = nombre de commits, versionName = git describe.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Godot et des modèles d'export
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-linux-templates

      - name: Installer Godot et les modèles d'export
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Ajouter Godot au PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      # Même keystore que les builds locaux : les mises à jour s'installent par-dessus.
      - name: Installer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          keystore=~/.local/share/godot/keystores/debug.keystore
          mkdir -p "$(dirname "$keystore")"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 absent : une version publiée doit être signée avec le keystore stable (voir README)."
            exit 1
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 absent : APK signé avec un keystore jetable, il ne s'installera pas par-dessus une version existante."
            keytool -genkeypair -keyalg RSA -keysize 2048 -validity 10000 -keystore "$keystore" \
              -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Construire l'APK (tests inclus)
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.DEBUG_KEYSTORE_ALIAS || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD || 'android' }}
        run: |
          ./scripts/build_android.sh
          version="$(git describe --tags --always)"
          cp build/repa_debug.apk "build/teardown-bench-${version}-debug.apk"
          echo "APK_PATH=build/teardown-bench-${version}-debug.apk" >> "$GITHUB_ENV"

      - name: Déposer l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: teardown-bench-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publier la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
